name: untitled3
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  speech_to_text: 7.4.0
  confetti: ^0.8.0
  shared_preferences: ^2.3.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  # --- Yeni Eklenen Paketler ---
  mobx: ^2.3.3
  flutter_mobx: ^2.2.1+1
  record: ^7.1.1
  path_provider: ^2.1.2
  http: ^1.2.1
  lottie: ^3.1.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # --- Yeni Eklenen Kod Üreticiler ---
  build_runner: ^2.4.9
  mobx_codegen: ^2.6.0+1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/resimler/
    - assets/3-4/
    - assets/4-5/
    - assets/5-6/
    - assets/dilart/
    - assets/sesler/
    - assets/lottie/
    - assets/hayvanlar/
    - assets/icon/
    - assets/maskot/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FF7A3D"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#FFF1E6"
  image: "assets/icon/icon_foreground.png"
  android_12:
    image: "assets/icon/icon_foreground.png"
    icon_background_color: "#FF7A3D"
    color: "#FFF1E6"

